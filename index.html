<html>

<head>
    <title>Grid</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .first-item { grid-area: header; }
        .second-item { grid-area: leftnav; }
        .third-item { grid-area: main; }

        .grid-container {
            display: grid;
            grid-template-areas:
                'leftnav header header'
                'leftnav main main'
            gap: 10px;
        }  
    </style>
</head>

<body>
    <div class="grid-container">
        <div class="first-item">header</div>
        <div class="second-item">leftnav</div>
        <div class="third-item">main</div>
    </div>
</body>

</html>
